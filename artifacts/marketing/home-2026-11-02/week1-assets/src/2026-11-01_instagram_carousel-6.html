<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#14181b;--ink7:#33404a;--ink5:#5d6d78;--paper:#f7f2e8;--card:#fdfaf4;--sage:#33604c;--sage05:#e2ebe4;--on:#f5f1e8;--muted:#a4b0b8}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Inter,sans-serif;background:var(--paper);color:var(--ink);position:relative}
.serif{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.page{position:absolute;inset:0;padding:96px 92px}
.dark{background:var(--ink);color:var(--on)}
.count{position:absolute;top:64px;right:76px;font:600 26px Inter;letter-spacing:.06em;color:var(--ink5)}
.dark .count{color:var(--muted)}
.brand{position:absolute;left:92px;bottom:80px;height:78px}.brand img{height:78px;display:block}
.brand .on-dark,.dark .brand .on-light{display:none}.dark .brand .on-dark{display:block}
</style></head><body>
<style>.n{position:absolute;left:92px;top:150px;font-size:150px;line-height:1;color:var(--sage)}
.h{position:absolute;left:92px;right:92px;top:330px;font-size:76px;line-height:1.08}
.body{position:absolute;left:110px;right:110px;top:600px}
.note{position:relative;background:var(--card);border-radius:10px;padding:70px 70px;
box-shadow:0 2px 3px rgba(20,24,27,.08),0 18px 40px rgba(20,24,27,.12);transform:rotate(-1.4deg)}
.q{font-size:58px;line-height:1.32;font-style:italic;color:var(--ink7)}
.pin{position:absolute;top:-14px;left:50%;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#b4472a;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.sm{margin:64px 0 0 -18px;font:500 38px Inter;color:var(--sage)}</style>
<div class="page"><div class="count">6/7</div><div class="n serif">5</div><div class="h serif">Your local favourites</div>
<div class="body"><div class="note"><div class="pin"></div><div class="q serif">&ldquo;Best coffee: the van at the surf club, from 6am. Best sunset: the rocks at the north end of the beach.&rdquo;</div></div>
<div class="sm">The things only a local knows.</div></div><div class="brand"><img class="on-light" src="logo-light-bg.png" alt="DigiStayBook"><img class="on-dark" src="logo-dark-bg.png" alt="DigiStayBook"></div></div></body></html>
