<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#14181b;--ink7:#33404a;--ink5:#5d6d78;--paper:#f7f2e8;--card:#fdfaf4;--sage:#33604c;--sage05:#e2ebe4;--on:#f5f1e8;--muted:#a4b0b8}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:Inter,sans-serif;background:var(--paper);color:var(--ink);position:relative}
.serif{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.page{position:absolute;inset:0;padding:96px 92px}
.dark{background:var(--ink);color:var(--on)}
.count{position:absolute;top:64px;right:76px;font:600 26px Inter;letter-spacing:.06em;color:var(--ink5)}
.dark .count{color:var(--muted)}
.brand{position:absolute;left:92px;bottom:80px;height:78px}.brand img{height:78px;display:block}
.brand .on-dark,.dark .brand .on-light{display:none}.dark .brand .on-dark{display:block}
</style></head><body>
<style>.h{position:absolute;left:92px;right:92px;top:520px;font-size:112px;line-height:1.12;letter-spacing:-.01em}
.h u{text-decoration:none;background:linear-gradient(transparent 86%,#5f8f78 86%,#5f8f78 95%,transparent 95%)}
.kicker{position:absolute;left:92px;top:450px;font:600 28px Inter;letter-spacing:.14em;text-transform:uppercase;color:#8fb3a1}
.brand{left:auto;right:92px}</style>
<div class="page dark"><div class="kicker">Control your own narrative</div>
<div class="h serif">Every home<br>has a <u>story</u>.<br>Tell yours.</div><div class="brand"><img class="on-light" src="logo-light-bg.png" alt="DigiStayBook"><img class="on-dark" src="logo-dark-bg.png" alt="DigiStayBook"></div></div></body></html>
