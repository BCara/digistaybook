<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head>
<body style="padding:24px;background:#f6f3ec">
<form class="wall-canvas" aria-label="Property view">
<div class="canvas-sheet" data-wall-theme="linen">
  <div class="canvas-cover">
    <button type="button" class="canvas-cover-hit" aria-label="Add a cover photograph">
      <span class="canvas-cover-empty">
        <svg class="camera-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M7.3 5.6 8.5 3.5h3l1.2 2.1"/><rect x="2.3" y="5.6" width="15.4" height="10.9" rx="1.9"/><circle cx="10" cy="11.1" r="3"/></svg>
        <b>The photograph across the top of both walls</b>
        A wide one of the property works best. It is the first thing a guest sees.
      </span>
      <span class="btn btn-secondary btn-sm canvas-cover-action" aria-hidden="true">Add a cover photograph</span>
    </button>
  </div>
  <div class="canvas-body">
    <div class="canvas-identity">
      <button type="button" class="canvas-portrait" aria-label="Add your photograph">
        <span class="canvas-portrait-mark" aria-hidden="true">
          <svg class="camera-mark" viewBox="0 0 20 20" focusable="false"><path d="M7.3 5.6 8.5 3.5h3l1.2 2.1"/><rect x="2.3" y="5.6" width="15.4" height="10.9" rx="1.9"/><circle cx="10" cy="11.1" r="3"/></svg>
        </span>
        <span class="btn btn-ghost btn-sm canvas-portrait-action" aria-hidden="true">Add your photograph</span>
      </button>
      <div class="canvas-titles">
        <h2 class="canvas-name"><span class="canvas-line">sdssds</span></h2>
        <p class="canvas-location">10 Street Name, Town, Postcode</p>
      </div>
    </div>
    <p class="phone-eyebrow">A note from your hosts</p>
  </div>
</div>
</form>
</body></html>
